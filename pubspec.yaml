name: list
description: "A new Flutter project for Captain Zone App."
publish_to: 'none'

version: 1.6.2+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  share_plus: ^7.2.2
  gal: ^2.3.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  fonts:
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/thmanyahserifdisplay-Regular.otf